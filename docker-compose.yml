# ili — Kanban-Dashboard, zwei Container: FastAPI-Backend (api) + nginx-Frontend
# (web), das html/ ausliefert und die API-Pfade proxyt (deploy/nginx-portable.conf).
# Ohne den web-Service liefert "/" nur die rohe JSON-API, kein Frontend.
#
# Start:   docker compose up -d --build        (oder: podman-compose up -d)
# Öffnen:  http://localhost:8080               (Port via ILI_PORT in .env)
# Update:  git pull && docker compose build && docker compose down && docker compose up -d
#          (podman-compose ignoriert --build auf `up` — siehe QUICKSTART)
#
# Daten liegen in benannten Volumes (Boards, Terminal-Login) und überleben jeden
# Neustart und jedes Update — siehe Abschnitt "Data Persistence" im QUICKSTART.

# Fester Projektname: sonst leitet Compose ihn vom Ordnernamen ab und die Volumes
# heissen nach einem Umbenennen anders — die Boards wären scheinbar verschwunden.
name: ili

# Container heissen ili-* passend zum Projektnamen. Container-Namen sind in Docker
# GLOBAL, nicht pro Projekt: mit den alten Namen (dashboard-api/-web) konnte dieser
# Stack nie neben einer zweiten ili-Installation laufen.

services:
  api:
    build:
      context: .
      dockerfile: Containerfile
    image: dashboard:latest
    container_name: ili-api
    restart: unless-stopped
    # Kein veroeffentlichter Port: das Frontend erreicht die API unter dem
    # Service-Namen `api` im Compose-Netz (siehe html/_api-locations.conf).
    # Nur zum Debuggen der rohen API einkommentieren (Port muss frei sein):
    # ports:
    #   - "127.0.0.1:8798:8798"
    volumes:
      # Boards persistent speichern (beim ersten Start werden Demo-Boards kopiert)
      - dashboard-boards:/app/boards
      - dashboard-data:/app/data
    environment:
      # KI-Features: Anthropic API-Key (optional — ohne Key laufen Kanban-Grundfunktionen)
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # Lokales Ollama (optional)
      OLLAMA_URL: "${OLLAMA_URL:-}"
      # URL unter der das Dashboard erreichbar ist (für interne Links)
      DASHBOARD_URL: "${DASHBOARD_URL:-http://localhost:8798}"
    healthcheck:
      # Die API bedient /boards; das /api-Praefix strippt erst das nginx-Frontend.
      test: ["CMD", "curl", "-fs", "http://localhost:8798/boards"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    image: docker.io/library/nginx:alpine
    container_name: ili-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # 8080 statt 80: Ports unter 1024 darf ein rootless-Podman/Docker-Nutzer
      # nicht binden — mit 80 scheitert der Start ohne erkennbaren Grund.
      - "${ILI_PORT:-8080}:80"
    environment:
      # Projekt-Terminal (/projterm/): Zugangsdaten fuer die Basic-Auth der Route.
      # Ohne TERMINAL_PASSWORD wird beim Start eines generiert und im Log
      # ausgegeben (docker compose logs web | grep ili-setup).
      TERMINAL_USER: "${TERMINAL_USER:-ili}"
      TERMINAL_PASSWORD: "${TERMINAL_PASSWORD:-}"
    volumes:
      - ./html:/usr/share/nginx/html:ro,Z
      - ./deploy/nginx-portable.conf:/etc/nginx/conf.d/default.conf:ro,Z
      # Laeuft vor nginx: wartet auf die API und legt die /projterm/-Route an
      # (echter Proxy, wenn der terminal-Service antwortet, sonst 503 + Anleitung).
      - ./deploy/nginx-setup.sh:/docker-entrypoint.d/20-ili-setup.sh:ro,Z

volumes:
  dashboard-boards:
  dashboard-data:
