# ili — Kanban-Dashboard, zwei Container: FastAPI-Backend (api) + nginx-Frontend
# (web), das html/ ausliefert und die API-Pfade proxyt (deploy/nginx-portable.conf).
# Ohne den web-Service liefert "/" nur die rohe JSON-API, kein Frontend.
#
# Zwei Wege, dieselbe Datei:
#   Registry (kein Clone noetig):  docker compose pull && docker compose up -d
#       Images: ghcr.io/toa1984/ili{,-web}:latest — Version pinnen
#       mit ILI_VERSION=0.1.0 in .env. (Solange das Repo privat ist, vorher
#       `docker login ghcr.io` mit einem read:packages-Token.)
#   Aus dem Quelltext:             docker compose up -d --build
#       (oder: podman-compose build && podman-compose up -d — podman-compose
#       ignoriert --build auf `up`, siehe QUICKSTART)
# Oeffnen:  http://localhost:8080               (Port via ILI_PORT in .env)
# Update:   docker compose pull && docker compose up -d   (Registry)
#           git pull && docker compose build && docker compose down && docker compose up -d  (Quelltext)
#
# Daten liegen in benannten Volumes (Boards, Terminal-Login) und überleben jeden
# Neustart und jedes Update — siehe Abschnitt "Data Persistence" im QUICKSTART.

# Fester Projektname: sonst leitet Compose ihn vom Ordnernamen ab und die Volumes
# heissen nach einem Umbenennen anders — die Boards wären scheinbar verschwunden.
name: ili

# Container heissen ili-* passend zum Projektnamen. Container-Namen sind in Docker
# GLOBAL, nicht pro Projekt: mit den alten Namen (dashboard-api/-web) konnte dieser
# Stack nie neben einer zweiten ili-Installation laufen.

services:
  api:
    build:
      context: .
      dockerfile: Containerfile
      args:
        ILI_COMMIT: ${ILI_COMMIT:-unknown}
        ILI_BUILD_DATE: ${ILI_BUILD_DATE:-unknown}
    image: ghcr.io/toa1984/ili:${ILI_VERSION:-latest}
    container_name: ili-api
    restart: unless-stopped
    # Kein veroeffentlichter Port: das Frontend erreicht die API unter dem
    # Service-Namen `api` im Compose-Netz (siehe html/_api-locations.conf).
    # Nur zum Debuggen der rohen API einkommentieren (Port muss frei sein):
    # ports:
    #   - "127.0.0.1:8798:8798"
    volumes:
      # Boards persistent speichern (beim ersten Start werden Demo-Boards kopiert)
      - dashboard-boards:/app/boards
      - dashboard-data:/app/data
      # Automat-State (Worker-Info, KI-Konfiguration) — wird mit dem Terminal-Service
      # gemountet, aber die api braucht Zugriff auf Worker-Status und ai_config.json
      - automat-state:/opt/ili-automat/state
    environment:
      # KI-Features: Anthropic API-Key (optional — ohne Key laufen Kanban-Grundfunktionen)
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      # Lokales Ollama (optional)
      OLLAMA_URL: "${OLLAMA_URL:-}"
      # GitHub feedback channel: public client id of the GitHub App "ili" (device-flow
      # login, no secret). Empty → "Mit GitHub anmelden" stays disabled, deep links still work.
      ILI_GITHUB_APP_CLIENT_ID: "${ILI_GITHUB_APP_CLIENT_ID:-}"
      # URL unter der das Dashboard erreichbar ist (für interne Links)
      DASHBOARD_URL: "${DASHBOARD_URL:-http://localhost:8798}"
      # Automat-State: Worker-Info und KI-Konfiguration (ai_config.json)
      AUTOMAT_STATE_DIR: "/opt/ili-automat/state"
      # Same credentials as the `db` service below, so api can mirror its own
      # WARNING/ERROR log lines into the `logs` table for bugs.html (see
      # app/services/log_db_service.py). Works even if `db` is not up yet —
      # startup retries, then falls back to stdout only. Delete the `db`
      # service entirely and this still degrades cleanly, nothing crashes.
      POSTGRES_HOST: "db"
      POSTGRES_PORT: "5432"
      POSTGRES_USER: "${POSTGRES_USER:-ili}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-CHANGE-ME}"
      POSTGRES_DB: "${POSTGRES_DB:-ili}"
      # How long rows stay in the `logs` table before the hourly cleanup deletes
      # them — without this the db-data volume would grow unbounded.
      LOG_RETENTION_DAYS: "${LOG_RETENTION_DAYS:-30}"
    healthcheck:
      # Die API bedient /boards; das /api-Praefix strippt erst das nginx-Frontend.
      test: ["CMD", "curl", "-fs", "http://localhost:8798/boards"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  web:
    # Gebackenes nginx-Image mit html/, nginx-portable.conf und nginx-setup.sh
    # (Containerfile.web). Frueher lagen die drei per Bind-Mount drin — das
    # setzte einen Clone voraus; aus der Registry allein gab es kein Frontend.
    build:
      context: .
      dockerfile: Containerfile.web
    image: ghcr.io/toa1984/ili-web:${ILI_VERSION:-latest}
    container_name: ili-web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      # 8080 statt 80: Ports unter 1024 darf ein rootless-Podman/Docker-Nutzer
      # nicht binden — mit 80 scheitert der Start ohne erkennbaren Grund.
      - "${ILI_PORT:-8080}:80"
    # Projekt-Terminal (/projterm/): Zugangsdaten fuer die Basic-Auth der Route
    # kommen ueber env_file statt ${}-Variablen-Substitution. Manche aeltere
    # podman-compose-Versionen interpolieren ${VAR}-Syntax gar nicht und reichen
    # sie an "podman run -e" literal durch (Board-Befund 21.08.2026) — env_file
    # liest .env stattdessen direkt ein und ist von diesem Bug nicht betroffen.
    # Ohne TERMINAL_PASSWORD in .env wird beim Start eines generiert und im Log
    # ausgegeben (docker compose logs web | grep ili-setup).
    env_file:
      - .env

  db:
    # PostgreSQL as a building block for YOUR projects, AND ili's own operational
    # log lines (WARNING/ERROR, table `logs`, see api's LOG_RETENTION_DAYS
    # above) — ili's boards themselves stay JSON files in the volumes below,
    # that part is unchanged. Code running in the project terminal reaches the
    # database as host `db`, port 5432.
    #
    # Note: project containers started the sandbox way (docker-compose.sandbox.yml,
    # Docker-in-Docker) live in their OWN network and can NOT see `db`. That path
    # needs its own database inside the sandbox. See docs/PROJECT-TERMINAL.md.
    image: docker.io/library/postgres:17-alpine
    container_name: ili-db
    restart: unless-stopped
    # No published port: the database is reachable only inside the compose
    # network. To attach a database tool from the host, uncomment this and bind
    # to 127.0.0.1 so it does not end up on the LAN:
    # ports:
    #   - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    # Defaults on purpose, not env_file: postgres refuses to start without a
    # password, so an existing installation whose .env predates this service
    # would go into a restart loop after an update. With defaults it comes up
    # and the user can set real credentials in .env whenever they need it.
    # (Very old podman-compose versions — 1.0.x — do not interpolate ${VAR} and
    # would pass the literal string as the password; the container still starts,
    # but then connect with exactly that. Upgrading podman-compose fixes it.)
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-ili}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-CHANGE-ME}"
      POSTGRES_DB: "${POSTGRES_DB:-ili}"
    healthcheck:
      # -U matters: without it pg_isready connects as the OS user (root), which
      # still reports success but writes a `FATAL: role "root" does not exist`
      # into the log on every single check. $$ escapes the variable so compose
      # leaves it for the container's shell to expand.
      test: ["CMD-SHELL", "pg_isready -q -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  dashboard-boards:
  dashboard-data:
  automat-state:
  db-data:
