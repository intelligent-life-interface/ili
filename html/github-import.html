<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐙 GitHub-Repos importieren</title>
  <script src="/js/esc.js?v=20260809-xss"></script>
  <script src="/i18n/de.js" defer></script>
  <script src="/ui-kit/v1/i18n.js" defer></script>
  <script src="/nav.js" defer></script>
  <link rel="stylesheet" href="/css/zones.css?v=20260804-zones">
  <link rel="stylesheet" href="/ui-kit/v1/ui-kit.css?v=20260816">
  <style>
    :root {
      --bg: var(--t-bg, #0f1117);
      --surface: var(--t-surface, #1a1d27);
      --border: var(--t-raised, #2a2d3e);
      --text: var(--t-text, #e2e8f0);
      --muted: var(--t-muted, #8892a4);
      --accent: #4a9eff;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }

    header {
      padding: 16px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      font-size: 1.05rem;
      font-weight: 600;
    }
    header p {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .wrap {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
    }

    .search-section {
      margin-bottom: 24px;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .search-section h2 {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }
    .input-group input {
      flex: 1;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-size: 0.9rem;
      font-family: inherit;
    }
    .input-group button {
      background: var(--accent);
      color: #000;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .input-group button:hover {
      opacity: 0.9;
    }
    .input-group button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .status-text {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 8px;
      min-height: 20px;
    }
    .status-text.loading::after {
      content: " ⏳";
    }
    .status-text.error {
      color: #fc8181;
    }
    .status-text.success {
      color: #68d391;
    }

    .repos-section {
      margin-bottom: 24px;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
    }
    .repos-section h2 {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .repo-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .repo-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      transition: background 0.2s;
    }
    .repo-item:hover {
      background: #1a1d27;
    }

    .repo-item input[type="checkbox"] {
      margin-top: 4px;
      width: 18px;
      height: 18px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .repo-info {
      flex: 1;
      min-width: 0;
    }
    .repo-name {
      font-weight: 600;
      font-size: 0.9rem;
      word-break: break-word;
    }
    .repo-desc {
      font-size: 0.78rem;
      color: var(--muted);
      margin-top: 2px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .repo-meta {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 4px;
      display: flex;
      gap: 12px;
    }

    .badge {
      font-size: 0.68rem;
      color: #f0b429;
      padding: 1px 7px;
      border-radius: 20px;
      border: 1px solid #5a4a20;
      white-space: nowrap;
    }
    .badge.pub {
      color: #68d391;
      border-color: #205a38;
    }

    .empty-repos {
      text-align: center;
      color: var(--muted);
      padding: 40px;
      font-size: 0.85rem;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }
    .actions button {
      padding: 10px 16px;
      border: none;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .actions .btn-import {
      background: var(--accent);
      color: #000;
    }
    .actions .btn-import:hover:not(:disabled) {
      opacity: 0.9;
    }
    .actions .btn-import:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .actions .btn-clear {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .actions .btn-clear:hover:not(:disabled) {
      background: #20242f;
    }

    .results-section {
      margin-top: 24px;
      padding: 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: none;
    }
    .results-section.active {
      display: block;
    }
    .results-section h2 {
      font-size: 0.95rem;
      font-weight: 600;
      margin-bottom: 12px;
    }

    .result-item {
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 6px;
      font-size: 0.85rem;
      word-break: break-word;
    }
    .result-item.created {
      background: #1a3a1a;
      color: #68d391;
      border-left: 3px solid #68d391;
    }
    .result-item.error {
      background: #3a1a1a;
      color: #fc8181;
      border-left: 3px solid #fc8181;
    }
    .result-item.skipped {
      background: #2a2a1a;
      color: #f0b429;
      border-left: 3px solid #f0b429;
    }

    .select-count {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 12px;
    }
  </style>
  <script src="/theme.js?v=20260716b" defer></script>
  <script src="/js/darstellung.js?v=20260716c" defer></script>
</head>
<body data-ui-autoinit="off">

  <div class="ds-zones">
    <header class="ds-zone-top">
      <h1>🐙 GitHub-Repos importieren</h1>
      <p>Verbinde GitHub-Repositories als neue Kanban-Boards mit deinem Dashboard.</p>
    </header>

    <main class="ds-zone-main">
      <div class="wrap">
        <!-- Suche -->
        <section class="search-section">
          <h2>GitHub-User suchen</h2>
          <div class="input-group">
            <input
              type="text"
              id="username"
              placeholder="GitHub-Username (z.B. octocat)"
              value="octocat"
            >
            <button id="searchBtn" onclick="searchRepos()">Suchen</button>
          </div>
          <div class="status-text" id="searchStatus"></div>
        </section>

        <!-- Repo-Liste -->
        <section class="repos-section">
          <h2>Repositories</h2>
          <div class="repo-list" id="repoList">
            <div class="empty-repos">Geben Sie einen Benutzernamen ein und klicken Sie auf "Suchen".</div>
          </div>
          <div class="select-count" id="selectCount"></div>
          <div class="actions">
            <button class="btn-import" id="importBtn" onclick="importSelected()" disabled>
              Import starten
            </button>
            <button class="btn-clear" id="clearBtn" onclick="clearSelection()">
              Auswahl löschen
            </button>
          </div>
        </section>

        <!-- Ergebnisse -->
        <section class="results-section" id="resultsSection">
          <h2>Import-Ergebnisse</h2>
          <div id="resultsList"></div>
        </section>
      </div>
    </main>
  </div>

  <script>
    const escHtml = (str) => {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    };

    let currentRepos = [];
    let selectedRepos = new Set();

    async function searchRepos() {
      const username = document.getElementById('username').value.trim() || 'octocat';
      const searchStatus = document.getElementById('searchStatus');
      const searchBtn = document.getElementById('searchBtn');

      searchStatus.textContent = 'Wird geladen…';
      searchStatus.classList.add('loading');
      searchBtn.disabled = true;

      try {
        const response = await fetch(`/api/projects/github/repos?user=${encodeURIComponent(username)}`);
        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.detail || 'Fehler beim Laden der Repos');
        }

        currentRepos = data.repos || [];
        selectedRepos.clear();
        displayRepos();

        searchStatus.textContent = `✓ ${currentRepos.length} Repositories gefunden`;
        searchStatus.classList.remove('loading', 'error');
        searchStatus.classList.add('success');
      } catch (error) {
        searchStatus.textContent = `✗ ${escHtml(error.message)}`;
        searchStatus.classList.remove('loading', 'success');
        searchStatus.classList.add('error');
        currentRepos = [];
        selectedRepos.clear();
        displayRepos();
      } finally {
        searchBtn.disabled = false;
      }
    }

    function displayRepos() {
      const repoList = document.getElementById('repoList');
      const importBtn = document.getElementById('importBtn');

      if (currentRepos.length === 0) {
        repoList.innerHTML = '<div class="empty-repos">Keine Repositories gefunden.</div>';
        importBtn.disabled = true;
        updateSelectCount();
        return;
      }

      repoList.innerHTML = currentRepos.map((repo, idx) => `
        <div class="repo-item">
          <input
            type="checkbox"
            id="repo-${idx}"
            data-full-name="${escHtml(repo.full_name)}"
            onchange="updateSelectCount()"
          >
          <div class="repo-info">
            <div class="repo-name">${escHtml(repo.full_name)}</div>
            ${repo.description ? `<div class="repo-desc">${escHtml(repo.description)}</div>` : ''}
            <div class="repo-meta">
              <span class="badge ${repo.private ? '' : 'pub'}">
                ${repo.private ? '🔒 Privat' : '🌐 Öffentlich'}
              </span>
            </div>
          </div>
        </div>
      `).join('');

      updateSelectCount();
    }

    function updateSelectCount() {
      const checkboxes = document.querySelectorAll('input[type="checkbox"][data-full-name]');
      selectedRepos.clear();
      checkboxes.forEach((cb) => {
        if (cb.checked) {
          selectedRepos.add(cb.dataset.fullName);
        }
      });

      const selectCount = document.getElementById('selectCount');
      selectCount.textContent = selectedRepos.size > 0
        ? `${selectedRepos.size} ausgewählt`
        : '';

      document.getElementById('importBtn').disabled = selectedRepos.size === 0;
    }

    function clearSelection() {
      document.querySelectorAll('input[type="checkbox"][data-full-name]').forEach((cb) => {
        cb.checked = false;
      });
      updateSelectCount();
    }

    async function importSelected() {
      if (selectedRepos.size === 0) return;

      const importBtn = document.getElementById('importBtn');
      const resultsSection = document.getElementById('resultsSection');
      const resultsList = document.getElementById('resultsList');

      importBtn.disabled = true;
      resultsSection.classList.add('active');
      resultsList.innerHTML = '<div class="result-item">Importieren läuft…</div>';

      try {
        const response = await fetch('/api/projects/github/import', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Dashboard-Token': localStorage.getItem('dashboard_api_token') || '',
          },
          body: JSON.stringify(Array.from(selectedRepos)),
        });

        const results = await response.json();

        if (!response.ok) {
          throw new Error(results.detail || 'Import fehlgeschlagen');
        }

        // Ergebnisse anzeigen
        resultsList.innerHTML = Object.entries(results).map(([fullName, result]) => {
          const isError = result.status && result.status.includes('error');
          const isCreated = result.status === 'created' || result.status === 'created_no_clone';
          const isSkipped = result.status === 'skipped';

          let classes = 'result-item';
          if (isError) classes += ' error';
          else if (isCreated) classes += ' created';
          else if (isSkipped) classes += ' skipped';

          const statusText = result.status === 'created'
            ? `✓ ${result.board_id} angelegt`
            : result.status === 'created_no_clone'
            ? `⚠ ${result.board_id} angelegt (Clone fehlgeschlagen)`
            : result.status === 'skipped'
            ? `ℹ ${escHtml(result.reason)}`
            : `✗ ${escHtml(result.error || result.reason || result.status)}`;

          return `<div class="${classes}"><strong>${escHtml(fullName)}</strong>: ${statusText}</div>`;
        }).join('');
      } catch (error) {
        resultsList.innerHTML = `<div class="result-item error"><strong>Fehler:</strong> ${escHtml(error.message)}</div>`;
      } finally {
        importBtn.disabled = false;
      }
    }

    // Tab-Icon für die Seite
    document.addEventListener('DOMContentLoaded', () => {
      document.title = '🐙 GitHub-Repos importieren';
    });
  </script>
</body>
</html>
