<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📈 Token-Wächter</title>
    <script src="/js/esc.js?v=20260809-xss"></script>
    <script src="/i18n/de.js" defer></script>
    <script src="/ui-kit/v1/i18n.js" defer></script>
    <script src="/nav.js" defer></script>
    <link rel="stylesheet" href="/css/zones.css?v=20260804-zones">
    <link rel="stylesheet" href="/ui-kit/v1/ui-kit.css?v=20260821">
<script src="/ui-kit/v1/ui-kit.js" defer></script>
    <link rel="stylesheet" href="/css/token-spikes.css?v=20260812">
</head>
<body>
<div class="ds-zones">
<header class="ds-zone-top">
    <h1 data-i18n="tokenguard.title">📈 Token-Wächter</h1>
    <span id="last-updated" class="tg-updated"></span>
</header>

<main class="ds-zone-main">
    <div class="tg-summary" id="tg-summary">⏳ Lade…</div>

    <div class="toolbar">
        <span class="toolbar-label" data-i18n="tokenguard.days">Zeitraum:</span>
        <select id="filter-days">
            <option value="7">7 Tage</option>
            <option value="14" selected>14 Tage</option>
            <option value="30">30 Tage</option>
            <option value="90">90 Tage</option>
        </select>
        <span class="toolbar-label" data-i18n="tokenguard.script">Skript:</span>
        <select id="filter-name"><option value="" data-i18n="tokenguard.allscripts">Alle Skripte</option></select>
        <span id="row-count"></span>
    </div>

    <div id="loading" data-i18n="tokenguard.loading">⏳ Lade Daten…</div>

    <div id="chart-wrap" style="display:none">
        <div class="tg-legend">
            <span class="tg-legend-item"><span class="tg-dot tg-dot-good"></span> <span data-i18n="tokenguard.legend.good">Normal</span></span>
            <span class="tg-legend-item"><span class="tg-dot tg-dot-critical"></span>⚠️ <span data-i18n="tokenguard.legend.spike">Spike (über Schwelle)</span></span>
            <span class="tg-legend-item"><span class="tg-line-sample"></span> <span data-i18n="tokenguard.legend.threshold">Schwelle</span></span>
        </div>
        <div class="tg-chart-scroll">
            <svg id="tg-svg" class="tg-svg"></svg>
        </div>
    </div>
    <div class="tg-tooltip" id="tg-tooltip" style="display:none"></div>

    <div class="table-wrap" id="table-wrap" style="display:none">
        <table id="tg-table">
            <thead>
                <tr>
                    <th data-i18n="tokenguard.col.ts">Zeit</th>
                    <th data-i18n="tokenguard.col.name">Skript</th>
                    <th data-i18n="tokenguard.col.weighted">Gewichtete Tokens</th>
                    <th data-i18n="tokenguard.col.threshold">Schwelle</th>
                    <th data-i18n="tokenguard.col.status">Status</th>
                </tr>
            </thead>
            <tbody id="tg-table-body"></tbody>
        </table>
    </div>
</main>
<footer class="ds-zone-bottom"><span data-i18n="footer.brand">Home Server · ili</span></footer>
</div>
<script src="/theme.js?v=20260716b" defer></script>
<script src="/js/token-spikes.js?v=20260812" defer></script>
</body>
</html>
