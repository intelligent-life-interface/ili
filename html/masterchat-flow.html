<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masterchat-Flow</title>
<script src="/js/esc.js?v=20260809-xss"></script>
<script src="/i18n/de.js" defer></script>
<script src="/ui-kit/v1/i18n.js" defer></script>
<script src="/nav.js" defer></script>
<link rel="stylesheet" href="/css/zones.css?v=20260804-zones">
<link rel="stylesheet" href="/ui-kit/v1/ui-kit.css?v=20260821">
<script src="/ui-kit/v1/ui-kit.js" defer></script>
<style>
  :root {
    --bg: var(--t-bg, #0f1117); --surface: var(--t-surface, #1a1d27); --border: var(--t-raised, #2a2d3e);
    --text: var(--t-text, #e2e8f0); --muted: var(--t-muted, #8892a4); --accent: #4a9eff;
    --green: #68d391; --orange: #f6ad55; --red: #fc8181;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: system-ui, sans-serif;
         display: flex; flex-direction: column; }

  header { padding: 10px 16px; background: var(--surface); border-bottom: 1px solid var(--border);
           display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 1rem; font-weight: 600; }
  header button { background: var(--accent); color: var(--accent-text, #fff); border: 0; padding: 6px 12px;
                  border-radius: 6px; cursor: pointer; font-size: 0.85rem; font-weight: 500; }
  header button:hover { filter: brightness(1.1); }
  header button:disabled { background: var(--border); cursor: not-allowed; }
  header .status { font-size: 0.78rem; color: var(--muted); min-width: 180px; }
  header .status.ok    { color: var(--green); }
  header .status.err   { color: var(--red); }
  header .status.busy  { color: var(--orange); }
  header .events { font-size: 0.7rem; color: var(--muted); font-family: monospace;
                   max-width: 360px; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  header a { color: var(--muted); text-decoration: none; font-size: 0.85rem; margin-left: auto; }
  header a:hover { color: var(--text); }

  #editor-wrap { flex: 1; position: relative; background: #fff; }
  #editor { width: 100%; height: 100%; border: 0; display: block; }
</style>
<script src="/theme.js?v=20260716b" defer></script>
</head>
<body>

<header>
  <h1>🔀 Masterchat-Flow</h1>
  <button id="btn-save" type="button">💾 Speichern</button>
  <span class="status" id="status">lädt…</span>
  <span class="events" id="events" title="Letzte drawio-Events"></span>
  <a href="/" data-i18n="app.back">← ili</a>
</header>

<div id="editor-wrap">
  <iframe id="editor"
          src="https://embed.diagrams.net/?embed=1&ui=dark&spin=1&proto=json&libraries=1"
          allowfullscreen></iframe>
</div>

<script>
const DIAGRAM_NAME = 'masterchat-flow';
const statusEl = document.getElementById('status');
const eventsEl = document.getElementById('events');
const btnSave  = document.getElementById('btn-save');
const editor   = document.getElementById('editor');

const eventLog = [];
function pushEvent(name) {
  eventLog.unshift(name);
  if (eventLog.length > 5) eventLog.pop();
  eventsEl.textContent = 'events: ' + eventLog.join(' · ');
}

function setStatus(text, cls) {
  statusEl.textContent = text;
  statusEl.className = 'status' + (cls ? ' ' + cls : '');
}

function postToEditor(payload) {
  editor.contentWindow.postMessage(JSON.stringify(payload), '*');
}

// Default-XML — wird verwendet, wenn auf dem Server noch nichts liegt.
const DEFAULT_XML = `<mxfile host="embed.diagrams.net">
  <diagram id="masterchat" name="Masterchat-Flow">
    <mxGraphModel dx="1200" dy="800" grid="1" gridSize="10" guides="1" tooltips="1" connect="1" arrows="1" fold="1" page="1" pageScale="1" pageWidth="1400" pageHeight="900" math="0" shadow="0">
      <root>
        <mxCell id="0"/>
        <mxCell id="1" parent="0"/>
        <mxCell id="title" value="MASTERCHAT (DM 1:1 mit Bot)" style="text;html=1;align=center;verticalAlign=middle;fontSize=18;fontStyle=1;fillColor=none;strokeColor=none;" vertex="1" parent="1"><mxGeometry x="40" y="20" width="600" height="40" as="geometry"/></mxCell>
        <mxCell id="in-text"  value="📝 Text" style="rounded=1;whiteSpace=wrap;html=1;fillColor=#1f3a5f;strokeColor=#4a9eff;fontColor=#fff;" vertex="1" parent="1"><mxGeometry x="40"  y="80" width="160" height="60" as="geometry"/></mxCell>
        <mxCell id="in-photo" value="📸 Foto" style="rounded=1;whiteSpace=wrap;html=1;fillColor=#1f3a5f;strokeColor=#4a9eff;fontColor=#fff;" vertex="1" parent="1"><mxGeometry x="220" y="80" width="160" height="60" as="geometry"/></mxCell>
        <mxCell id="in-voice" value="🎙️ Sprachnotiz" style="rounded=1;whiteSpace=wrap;html=1;fillColor=#1f3a5f;strokeColor=#4a9eff;fontColor=#fff;" vertex="1" parent="1"><mxGeometry x="400" y="80" width="160" height="60" as="geometry"/></mxCell>
        <mxCell id="classifier" value="Intent-Klassifier&#10;(Ollama lokal)" style="rhombus;whiteSpace=wrap;html=1;fillColor=#2d3748;strokeColor=#b794f4;fontColor=#fff;" vertex="1" parent="1"><mxGeometry x="220" y="200" width="220" height="100" as="geometry"/></mxCell>
        <mxCell id="photo-vision" value="Vision: minicpm-v&#10;Vokabel-Tafel? Objekt? Idee?" style="rounded=1;whiteSpace=wrap;html=1;fillColor=#374151;strokeColor=#8892a4;fontColor=#fff;" vertex="1" parent="1"><mxGeometry x="600" y="80" width="240" height="60" as="geometry"/></mxCell>
        <mxCell id="voice-whisper" value="Whisper → Text" style="rounded=1;whiteSpace=wrap;html=1;fillColor=#374151;strokeColor=#8892a4;fontColor=#fff;" vertex="1" parent="1"><mxGeometry x="900" y="80" width="180" height="60" as="geometry"/></mxCell>
        <mxCell id="a-lernen" value="LERNEN &lt;sprache&gt;&#10;→ Sprach-Gruppe öffnen/erstellen" style="rounded=1;whiteSpace=wrap;html=1;fillColor=#22543d;strokeColor=#68d391;fontColor=#fff;" vertex="1" parent="1"><mxGeometry x="40"  y="360" width="220" height="80" as="geometry"/></mxCell>
        <mxCell id="a-projekt" value="PROJEKT/IDEE&#10;→ Kanban + Ordner" style="rounded=1;whiteSpace=wrap;html=1;fillColor=#22543d;strokeColor=#68d391;fontColor=#fff;" vertex="1" parent="1"><mxGeometry x="280" y="360" width="220" height="80" as="geometry"/></mxCell>
        <mxCell id="a-bug"    value="BUG&#10;→ POST /bug-report" style="rounded=1;whiteSpace=wrap;html=1;fillColor=#22543d;strokeColor=#68d391;fontColor=#fff;" vertex="1" parent="1"><mxGeometry x="520" y="360" width="220" height="80" as="geometry"/></mxCell>
        <mxCell id="a-status" value="STATUS / FRAGE&#10;→ Ollama-Antwort" style="rounded=1;whiteSpace=wrap;html=1;fillColor=#22543d;strokeColor=#68d391;fontColor=#fff;" vertex="1" parent="1"><mxGeometry x="760" y="360" width="220" height="80" as="geometry"/></mxCell>
        <mxCell id="a-unklar" value="UNKLAR&#10;→ Rückfrage mit 2-3 Optionen" style="rounded=1;whiteSpace=wrap;html=1;fillColor=#7c2d12;strokeColor=#f6ad55;fontColor=#fff;" vertex="1" parent="1"><mxGeometry x="1000" y="360" width="220" height="80" as="geometry"/></mxCell>
        <mxCell id="e1" style="edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=block;strokeColor=#8892a4;" edge="1" parent="1" source="in-text" target="classifier"><mxGeometry relative="1" as="geometry"/></mxCell>
        <mxCell id="e2" style="edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=block;strokeColor=#8892a4;" edge="1" parent="1" source="in-photo" target="photo-vision"><mxGeometry relative="1" as="geometry"/></mxCell>
        <mxCell id="e3" style="edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=block;strokeColor=#8892a4;" edge="1" parent="1" source="in-voice" target="voice-whisper"><mxGeometry relative="1" as="geometry"/></mxCell>
        <mxCell id="e4" style="edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=block;strokeColor=#8892a4;" edge="1" parent="1" source="photo-vision" target="classifier"><mxGeometry relative="1" as="geometry"/></mxCell>
        <mxCell id="e5" style="edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=block;strokeColor=#8892a4;" edge="1" parent="1" source="voice-whisper" target="classifier"><mxGeometry relative="1" as="geometry"/></mxCell>
        <mxCell id="e6" style="edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=block;strokeColor=#68d391;" edge="1" parent="1" source="classifier" target="a-lernen"><mxGeometry relative="1" as="geometry"/></mxCell>
        <mxCell id="e7" style="edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=block;strokeColor=#68d391;" edge="1" parent="1" source="classifier" target="a-projekt"><mxGeometry relative="1" as="geometry"/></mxCell>
        <mxCell id="e8" style="edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=block;strokeColor=#68d391;" edge="1" parent="1" source="classifier" target="a-bug"><mxGeometry relative="1" as="geometry"/></mxCell>
        <mxCell id="e9" style="edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=block;strokeColor=#68d391;" edge="1" parent="1" source="classifier" target="a-status"><mxGeometry relative="1" as="geometry"/></mxCell>
        <mxCell id="e10" style="edgeStyle=orthogonalEdgeStyle;rounded=0;html=1;endArrow=block;strokeColor=#f6ad55;" edge="1" parent="1" source="classifier" target="a-unklar"><mxGeometry relative="1" as="geometry"/></mxCell>
      </root>
    </mxGraphModel>
  </diagram>
</mxfile>`;

let loadedXml = '';
let initialized = false;

async function loadFromServer() {
  try {
    const r = await fetch('/load-diagram?name=' + encodeURIComponent(DIAGRAM_NAME), { cache: 'no-store' });
    const j = await r.json();
    const xml = (j.xml || '').trim();
    loadedXml = xml || DEFAULT_XML;
    console.log('[flow] load ok, len=', loadedXml.length, 'fromDefault=', !xml);
  } catch (e) {
    console.error('[flow] load fehlgeschlagen:', e);
    loadedXml = DEFAULT_XML;
    setStatus('Server nicht erreichbar — zeige Default', 'err');
  }
}

async function saveToServer(xml) {
  if (!xml || xml.length < 20) {
    console.warn('[flow] save abgebrochen — xml leer/zu kurz');
    return;
  }
  setStatus('speichere…', 'busy');
  try {
    const r = await fetch('/save-diagram', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: DIAGRAM_NAME, xml: xml })
    });
    const j = await r.json();
    if (j.saved) {
      const t = new Date().toLocaleTimeString();
      setStatus('✅ gespeichert ' + t + ' (' + j.bytes + ' B)', 'ok');
      postToEditor({ action: 'status', message: 'gespeichert', modified: false });
    } else {
      setStatus('Speichern: ' + (j.error || '?'), 'err');
    }
  } catch (e) {
    console.error('[flow] save fehlgeschlagen:', e);
    setStatus('Speichern fehlgeschlagen: ' + e.message, 'err');
  }
}

// Hauptbridge — drawio ↔ Server
window.addEventListener('message', (evt) => {
  if (evt.source !== editor.contentWindow) return;
  let msg;
  try { msg = JSON.parse(evt.data); } catch { return; }

  pushEvent(msg.event || '?');
  console.log('[flow] msg from drawio:', msg);

  switch (msg.event) {
    case 'init':
      initialized = true;
      postToEditor({ action: 'load', xml: loadedXml, autosave: 1 });
      setStatus('geladen — Autosave aktiv', 'ok');
      break;

    case 'save':
    case 'autosave':
      if (msg.xml) saveToServer(msg.xml);
      break;

    case 'export':
      // Antwort auf manuellen Save-Klick: enthält das aktuelle XML
      if (msg.xml) saveToServer(msg.xml);
      break;

    case 'configure':
      // Wir nutzen kein configure=1 — falls drawio es trotzdem sendet, ack
      postToEditor({ action: 'configure', config: {} });
      break;
  }
});

// Manueller Save-Button → exportiert das aktuelle XML aus drawio
btnSave.addEventListener('click', () => {
  if (!initialized) {
    setStatus('Editor lädt noch…', 'busy');
    return;
  }
  setStatus('exportiere…', 'busy');
  postToEditor({ action: 'export', format: 'xml' });
});

loadFromServer();
</script>

</body>
</html>
