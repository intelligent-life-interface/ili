# _api-locations.conf — gemeinsame API-Proxy-Locations (→ FastAPI 8798)
# Wird von BEIDEN server-Blöcken in nginx.conf via `include` eingebunden:
#   - server :80   (Desktop-Dashboard)
#   - server :8201 (iPhone-/Mobile-Ansicht unter /m/)
# Liegt im gemounteten html/-Ordner, damit KEIN zusätzlicher Container-Mount nötig ist.
#
# Ziel ist der Compose-Service `api` (Container-DNS im gemeinsamen Netz).
# WICHTIG, nicht auf `host.containers.internal` zurückstellen: Podman schreibt
# diesen Namen selbst in /etc/hosts und zeigt damit auf den HOST — das Frontend
# sprach dann mit dem, was auf dem Host-Port 8798 zufällig läuft, statt mit dem
# eigenen api-Container (gefunden 17.08.2026 beim Fremdinstallations-Test).
# Wer das Backend NICHT als Container betreibt, setzt hier seinen eigenen
# Host/Port ein.
# (Die Datei selbst wird per `location = /_api-locations.conf { return 404; }` nicht ausgeliefert.)

# Rohes Board-JSON ohne CLAUDE.md-Injektion (Consumer: kanban-split, meist Direktzugriff :8798)
location /kanban-api {
    proxy_pass http://api:8798/kanban-api;
    proxy_set_header Host $host;
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
    add_header Access-Control-Allow-Headers "Content-Type";
}

# Streaming-Endpoints: Buffering aus, damit Tokens sofort ankommen
location ~ ^/(ki-explain-stream|analyse-bug|api/brainstorm/stream)$ {
    proxy_pass http://api:8798;
    proxy_set_header Host $host;
    proxy_read_timeout 300s;
    proxy_buffering off;
    proxy_cache off;
    client_max_body_size 1m;
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods "POST, OPTIONS";
    add_header Access-Control-Allow-Headers "Content-Type";
    add_header X-Accel-Buffering no;
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Methods "POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type";
        add_header Access-Control-Allow-Origin *;
        return 204;
    }
}

# Datei-Anhänge (Board/Karte) — 100 MB Upload-Limit + längere Timeouts. ^~ schlägt die Regex.
location ^~ /api/attachments {
    proxy_pass http://api:8798;
    proxy_set_header Host $host;
    proxy_read_timeout 600s;
    proxy_send_timeout 600s;
    client_max_body_size 100m;
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS";
    add_header Access-Control-Allow-Headers "Content-Type, Authorization";
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization";
        add_header Access-Control-Allow-Origin *;
        return 204;
    }
}

# Haupt-API (FastAPI 8798) — Reads/Writes/KI/Misc
location ~ ^/(board-templates|categories|statuses|api/models|api/ai-config|api/client-config|api/dashboard|api/version|api/isehauer|api/budget|api/claude-limits|api/web-adressen|api/project-links|api/project-files|api/automat|api/ollama|api/brainstorm|api/projects|api/manager|api/user-settings|api/fragen|api/claude-theme|api/token-guard|api/usage|claude-cost|ollama-usage|board-rollup|search-by-tag|find-related|dedup-check|prio-suggest|eisenhower-suggest|cleanup-board|card-owner|scan-logs|boards|board|ki-advisor|ki-reject|ki-accept|ki-reactivate|ki-feedback|ki-explain-queue|ki-explain-results|ki-bug-report|ki-global-reject|ki-global-rejections|ki-global-reactivate|ki-critique|ollama-stats|wa-whitelist|load-diagram|save-diagram|list-diagrams|whitelist|services-api|chat|title-suggest|project-from-photo|bug-report|bot-status|bot-answer|projterm-heal|api/claude-status)(/.*)?$ {
    proxy_pass http://api:8798;
    proxy_set_header Host $host;
    proxy_read_timeout 180s;
    client_max_body_size 30m;
    add_header Access-Control-Allow-Origin *;
    add_header Access-Control-Allow-Methods "GET, POST, DELETE, PATCH, OPTIONS";
    add_header Access-Control-Allow-Headers "Content-Type, Authorization";
    if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Methods "GET, POST, DELETE, PATCH, OPTIONS";
        add_header Access-Control-Allow-Headers "Content-Type, Authorization";
        add_header Access-Control-Allow-Origin *;
        return 204;
    }
}
