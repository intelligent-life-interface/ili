server {
    listen 80;
    server_name _;

    # Alles über HTTPS erzwingen (2026-06-17): Das ttyd-WS-Auth-Cookie ist `Secure` und wird
    # vom Browser über unverschlüsseltes http (z.B. http://SERVER_IP) NICHT gesendet ->
    # /projterm/ws bekommt 403 -> Terminal lädt, nimmt aber keine Eingabe an ("bad response
    # from server"). Darum direkte http-Zugriffe auf die HTTPS-Domain umleiten.
    # WICHTIG: Caddy terminiert TLS und proxyt selbst per http auf :80, setzt dabei aber
    # X-Forwarded-Proto=https. Nur umleiten wenn dieser Header fehlt -> kein Redirect-Loop.
    if ($http_x_forwarded_proto != "https") {
        return 301 https://$http_host$request_uri;
    }

    root /usr/share/nginx/html;
    index index.html;

    # HTML/JS/CSS nie hart cachen — Seiten werden aktiv entwickelt; ohne das hält der
    # Browser alte js/api.js+index.js fest (Gotcha 2026-06-10: "apiGet is not a function")
    location ~* \.(html|js|css)$ {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Interne Include-Datei nicht ausliefern (= hat höchste Priorität, schlägt Regex/Prefix)
    location = /_api-locations.conf { return 404; }

    # Alle API-Proxy-Locations (→ FastAPI 8798). Ausgelagert nach html/_api-locations.conf,
    # damit der Mobile-server-Block unten (:8201) dieselben Routen wiederverwenden kann.
    include /usr/share/nginx/html/_api-locations.conf;

    # Hinweis: Der alte trigger_server-Catch-all (Port 8799) wurde am 2026-06-10
    # entfernt — Phase 7 abgeschlossen, alle Routen laufen über FastAPI (8798).

    # Pro-Projekt-Terminals (ttyd Port 7690, Kanban-"Terminal"-Panel). Die Locations
    # /projterm/ + /projterm/ws stehen in einer separaten, GITIGNORED Datei, weil sie
    # Secrets (Auth-B64 + WS-Cookie) enthalten — separat in den Container gemountet.
    include /etc/nginx/projterm-locations.conf;
}
