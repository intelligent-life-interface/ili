# docker-compose.terminal.yml — schaltet das Projekt-Terminal zu.
#
# Browser-Terminal mit einer tmux-Session pro Kanban-Board und Claude Code darin.
# Bewusst eine EIGENE Datei statt eines compose-Profils: ein Browser-Terminal ist
# voller Shell-Zugriff, und aeltere podman-compose-Versionen (1.0.3 in Debian 12)
# ignorieren `profiles:` stillschweigend — der Terminal-Container waere dort trotz
# Profil immer mitgestartet. Eine zweite Datei wirkt in jeder Version.
#
# Start (Registry):
#     docker compose -f docker-compose.yml -f docker-compose.terminal.yml up -d
# Start (aus dem Quelltext):
#     docker compose -f docker-compose.yml -f docker-compose.terminal.yml up -d --build
#
# Bequemer: einmal COMPOSE_FILE in die .env schreiben, dann genuegt weiterhin
# `docker compose up -d` (siehe .env.example).
#
# Es wird KEIN Port veroeffentlicht: das Terminal ist nur ueber die
# passwortgeschuetzte Route /projterm/ des web-Containers erreichbar.

name: ili

services:
  # api sieht ohne das Terminal-Profil kein terminal-home-Volume und keinen
  # OAuth-Token — das Login-Panel (html/claude-login-panel.html) bleibt dann
  # korrekt bei logged_in:false statt einen alten/falschen Zustand zu zeigen.
  api:
    # Credentials (CLAUDE_CODE_OAUTH_TOKEN / ANTHROPIC_API_KEY) and tuning knobs come
    # from .env via env_file — old podman-compose (1.0.3) does not interpolate ${VAR}.
    env_file:
      - .env
    environment:
      # Pfad zum .credentials.json-Check in app/api/misc.py — muss zum Mount unten passen.
      CLAUDE_CONFIG_DIR: /claude-home/.claude
      # KI project preparation goes through the bridge inside the terminal container
      CLAUDE_BRIDGE_URL: http://terminal:8950
      # Project folders (CLAUDE.md/TAGS.md from the KI preparation) must be the same
      # directory the terminal sessions and the automat workers run in.
      PROJEKTE_DIR: /projects
      # Automat-State: Worker-Info und KI-Konfiguration (ai_config.json)
      AUTOMAT_STATE_DIR: /opt/ili-automat/state
    volumes:
      - ./projects:/projects:z
      # Nur lesen: api darf den Login-Zustand PRÜFEN, nie verändern. Das Senden des
      # Device-Codes läuft client-seitig über das Terminal-iframe, nicht über api.
      - terminal-home:/claude-home:ro
      # Automat-State: rw für ai_config.json (GUI-Einstellungen)
      - automat-state:/opt/ili-automat/state

  terminal:
    build:
      context: .
      dockerfile: deploy/Containerfile.terminal
    image: ghcr.io/toa1984/ili-terminal:${ILI_VERSION:-latest}
    container_name: ili-terminal
    restart: unless-stopped
    # Credentials (CLAUDE_CODE_OAUTH_TOKEN / ANTHROPIC_API_KEY) and tuning knobs come
    # from .env via env_file — old podman-compose (1.0.3) does not interpolate ${VAR}.
    env_file:
      - .env
    expose:
      - "7690"
      - "8950"
    environment:
      # Claude-Anmeldung — alles optional. Ist nichts gesetzt, fuehrt das Terminal
      # beim ersten Oeffnen durch den Login (Code aus dem Browser
      # zurueckkopieren). Details: docs/PROJECT-TERMINAL.md
      PROJECTS_DIR: /projects
      BRIDGE_KEEP_API_KEY: "1"
      BOARDS_DIR: /boards
    volumes:
      # /root haelt die Claude-Anmeldung (.claude/ + .claude.json) — dieses Volume
      # behalten, sonst ist nach jedem Neustart ein neuer Login faellig.
      - terminal-home:/root
      # Arbeitsordner: pro Board ein Unterordner (Konvention Projekt = Board).
      # Eigenen Code-Ordner einhaengen: ./projects hier (in allen drei Services) ersetzen
      - ./projects:/projects:z
      # Boards nur lesen — das Terminal prueft damit, ob ein Board existiert.
      - dashboard-boards:/boards:ro

  # Kanban automat: picks up cards from boards with auto:true and lets headless Claude
  # sessions work on them (every AUTOMAT_INTERVAL s). Same image as the terminal so it
  # shares the Claude login (terminal-home). Pause: touch state/automat.disabled in the
  # automat-state volume.
  automat:
    image: ghcr.io/toa1984/ili-terminal:${ILI_VERSION:-latest}
    container_name: ili-automat
    restart: unless-stopped
    # Credentials (CLAUDE_CODE_OAUTH_TOKEN / ANTHROPIC_API_KEY) and tuning knobs come
    # from .env via env_file — old podman-compose (1.0.3) does not interpolate ${VAR}.
    env_file:
      - .env
    entrypoint: ["python3", "/opt/ili-automat/ticker.py"]
    depends_on:
      - api
      - terminal
    environment:
      CLAUDE_CONFIG_DIR: /root/.claude
      AUTOMAT_ALLOW_API_KEY: "1"
      BRIDGE_URL: http://terminal:8950
      # Claude Code refuses --dangerously-skip-permissions as root unless sandboxed
      IS_SANDBOX: "1"
      DASHBOARD_URL: http://api:8798
      KANBAN_SOURCE: automat
      AUTOMAT_PROJECT_DIRS: /projects
      AUTOMAT_LOG_BOARD: ""
      ILI_DASHBOARD_DIR: /opt/ili-automat/state
      ILI_CONFIG_ENV: /dev/null
    volumes:
      - terminal-home:/root
      - ./projects:/projects:z
      - automat-state:/opt/ili-automat/state
volumes:
  dashboard-boards:
  terminal-home:
  automat-state:
