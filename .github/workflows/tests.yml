# tests.yml — runs the Python test suite (tests/) on every push and PR.
#
# Added 2026-09-08: tests/test_nginx_api_routes.py checks the FastAPI route list
# against html/_api-locations.conf so a new /api/ endpoint that's missing from the
# nginx allowlist fails CI instead of silently 404'ing (or worse, silently getting
# index.html back — see that test's docstring). Before this workflow the test file
# existed but nothing ever ran it, which is how the gap reached its fifth occurrence.
#
# The same file lives in BOTH repos (the workshop->public sync copies it 1:1).
name: Tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest tests/ -q
