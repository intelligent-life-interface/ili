# release.yml — builds the three ili images and pushes them to ghcr.io AND Docker Hub.
#
# Trigger: a version tag (git tag v0.1.0 && git push --tags) or a manual run.
# Versioning is manual semver (project decision) — see docs/RELEASING.md.
#
# Images (namespace must be lowercase for ghcr):
#   ghcr.io/toa1984/ili           FastAPI backend   (Containerfile)
#   ghcr.io/toa1984/ili-web       nginx frontend    (Containerfile.web)
#   ghcr.io/toa1984/ili-terminal  browser terminal  (deploy/Containerfile.terminal)
#
# Docker Hub mirrors (discoverability via docker search — ghcr is not indexed there):
#   docker.io/toa1984/ili{,-web,-terminal} — same tags, pushed in the same build.
#   Requires repo secrets DOCKERHUB_USERNAME + DOCKERHUB_TOKEN (PAT, read/write).
#
# Tags per image: X.Y.Z, X.Y, latest (latest only for non-prerelease tags).
# The packages inherit the repository visibility (private until the publish gate
# is passed) — switching them public is a manual, separate step.
name: Release images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/toa1984/ili

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            suffix: ""
            file: Containerfile
          - name: web
            suffix: "-web"
            file: Containerfile.web
          - name: terminal
            suffix: "-terminal"
            file: deploy/Containerfile.terminal
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Image metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.IMAGE_BASE }}${{ matrix.suffix }}
            docker.io/toa1984/ili${{ matrix.suffix }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=raw,value=edge,enable=${{ github.event_name == 'workflow_dispatch' }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=AGPL-3.0

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

      # Vulnerability gate — runs AFTER the push, so a red run signals rather than
      # prevents: the image is already in both registries. Only findings with an
      # available fix count (--ignore-unfixed); unfixed Debian CVEs are present in
      # every current base image and would block every release. npm's own bundled
      # dependencies are skipped: the terminal image already installs npm@latest,
      # anything flagged in there is fixed only by the next npm release.
      - name: Scan pushed image (Trivy, fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_BASE }}${{ matrix.suffix }}:${{ steps.meta.outputs.version }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          skip-dirs: /usr/local/lib/node_modules/npm
          exit-code: "1"
          format: table

      - name: Summary
        if: always()
        run: |
          echo "### ${{ matrix.name }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
