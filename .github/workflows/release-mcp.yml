# release-mcp.yml — builds and pushes the ili Kanban MCP Server to ghcr.io
# Also registers a custom `docker mcp` catalog (ghcr.io/toa1984/mcp-catalog) via the
# docker/mcp-gateway CLI plugin — installed at runtime since it's not part of the
# ubuntu-latest image (plain Docker Engine, no Docker Desktop). CLI is pre-release
# (no stable 1.0 yet), so this step is continue-on-error and doesn't block the image
# build/push/scan. Official docker/mcp-registry listing still needs a separate PR
# (servers/ili-kanban/server-docker-registry.yaml).
#
# Trigger: git tag mcp-v* (e.g., git tag mcp-v0.1.0 && git push --tags)
# Image: ghcr.io/toa1984/ili-mcp
#
# The MCP Server is a single Docker image (Python stdio server for ili Kanban boards).
# Versioning follows the pattern mcp-vX.Y.Z (independent from ili version).

name: Release MCP Server

on:
  push:
    tags: ["mcp-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_BASE: ghcr.io/toa1984/ili-mcp

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU (arm64 builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: |
          # Strip 'mcp-' prefix to get semver version
          TAG="${{ github.ref }}"
          VERSION="${TAG#refs/tags/mcp-}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Image metadata (tags + OCI labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BASE }}
          tags: |
            type=semver,pattern={{version}},input=${{ steps.version.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},input=${{ steps.version.outputs.version }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=ili Kanban MCP Server
            org.opencontainers.image.description=MCP Server for ili Dashboard Kanban boards
            org.opencontainers.image.source=https://github.com/${{ github.repository }}/tree/main/mcp
            org.opencontainers.image.licenses=MIT

      - name: Build and push MCP Server
        uses: docker/build-push-action@v6
        with:
          context: mcp
          file: mcp/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=mcp
          cache-to: type=gha,scope=mcp,mode=max

      - name: Scan MCP image (Trivy, fixable CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_BASE }}:${{ steps.version.outputs.version }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Install docker mcp CLI plugin
        # docker/mcp-gateway has no stable 1.0 release yet (all tags are prereleases);
        # don't let install/CLI-syntax drift block the image build+push+scan above.
        continue-on-error: true
        env:
          MCP_GATEWAY_VERSION: v0.43.3
        run: |
          mkdir -p ~/.docker/cli-plugins/
          curl -fsSL "https://github.com/docker/mcp-gateway/releases/download/${MCP_GATEWAY_VERSION}/docker-mcp-linux-amd64.tar.gz" \
            | tar -xz -C ~/.docker/cli-plugins/
          chmod +x ~/.docker/cli-plugins/docker-mcp
          docker mcp version
          # Required on plain Docker Engine (no Docker Desktop) per docker/mcp-gateway docs.
          docker mcp feature enable profiles

      - name: Register with own docker mcp catalog (ghcr.io)
        continue-on-error: true
        env:
          CATALOG_REF: ghcr.io/toa1984/mcp-catalog:latest
        run: |
          echo "Building catalog entry from mcp/server.yaml"
          docker mcp catalog create "${CATALOG_REF}" \
            --server file://mcp/server.yaml \
            --title "ili Kanban MCP Catalog"
          echo "Pushing catalog to ${CATALOG_REF}"
          docker mcp catalog push "${CATALOG_REF}"
          echo "Custom catalog: docker mcp catalog add ${CATALOG_REF} (client-side usage)"
          echo "PR to docker/mcp-registry (servers/ili-kanban/server-docker-registry.yaml) still needed for the official catalog."

      - name: Summary
        if: always()
        run: |
          echo "### MCP Server Release" >> "$GITHUB_STEP_SUMMARY"
          echo "**Image:** ${{ env.IMAGE_BASE }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Version:** ${{ steps.version.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Tags:**" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Next:** PR to [docker/mcp-registry](https://github.com/docker/mcp-registry) with `servers/ili-kanban/server-docker-registry.yaml`" >> "$GITHUB_STEP_SUMMARY"
