# deploy/gateway/nginx.conf — network container for project containers.
#
# The gateway reserves a port range on the host and forwards it 1:1 into the DinD
# sandbox: host port N -> sandbox:N. That way the sandbox service itself publishes
# no port at all, and the reservation lives in exactly one place
# (docker-compose.sandbox.yml).
#
# Why a top-level config instead of a file in conf.d/: conf.d/*.conf is included
# INSIDE http {}, and a stream {} block may not appear there. It has to sit at the
# top level.
#
# Why stream (TCP) instead of an HTTP proxy_pass: protocol independence. A project
# may serve a web app, a database or a WebSocket endpoint behind its port — TCP
# passes all of it through untouched, with no header handling.

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

stream {
    log_format  ili_basic  '$remote_addr [$time_local] '
                           'port=$server_port -> $upstream_addr '
                           'status=$status sent=$bytes_sent recv=$bytes_received '
                           'duration=$session_time';
    access_log  /var/log/nginx/stream-access.log  ili_basic;

    proxy_connect_timeout  5s;
    # Do not cut long-lived connections (WebSockets, database sessions) after the
    # default 10 minutes
    proxy_timeout          1h;

    # 00-resolver.conf (DNS) and one server{} block per port — nginx' listen knows
    # no port ranges. Written at container start by
    # /docker-entrypoint.d/10-generate-streams.sh
    include /etc/nginx/stream.d/*.conf;
}
