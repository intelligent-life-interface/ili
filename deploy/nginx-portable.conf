# nginx-portable.conf — Frontend-Konfiguration fuer eine Installation auf einer
# fremden Maschine (siehe INSTALL-Abschnitt im README).
#
# Unterschied zur produktiven ~/containers/dashboard/nginx.conf:
#   - kein HTTPS-Zwang (die produktive Datei leitet ohne X-Forwarded-Proto=https
#     per 301 um und ist damit ohne vorgelagerten Caddy nicht bedienbar)
#   - das Projekt-Terminal kommt aus dem `terminal`-Compose-Service statt aus
#     einer lokal gitignoreten `projterm-locations.conf` (die Secrets enthaelt
#     und auf jeder anderen Maschine fehlt). Die Route erzeugt
#     `deploy/nginx-setup.sh` beim Start des web-Containers.
#
# Erwartet: den `api`-Service im gleichen Compose-Netz — die proxy_pass-Ziele in
# html/_api-locations.conf zeigen auf `api:8798`. Ein veroeffentlichter Host-Port
# ist dafuer NICHT noetig.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Skripte/Styles: NIE auf index.html zurueckfallen. Fehlt eine Datei, parst der
    # Browser HTML als JavaScript ("Unexpected token '<'") und die Seite bleibt beim
    # Laden stehen — ein 404 ist im Log sichtbar und bricht nur diese eine Datei.
    location ~* \.(js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # HTML nicht hart cachen — sonst haelt der Browser alte Seiten fest
    location ~* \.html$ {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Interne Include-Datei nicht ausliefern
    location = /_api-locations.conf { return 404; }

    # Alle API-Proxy-Locations (-> FastAPI 8798), strippen das /api-Praefix
    include /usr/share/nginx/html/_api-locations.conf;

    # Projekt-Terminal (/projterm/). Die Datei erzeugt
    # deploy/nginx-setup.sh vor dem nginx-Start: entweder der echte
    # Proxy auf den terminal-Service oder ein 503-Platzhalter mit Anleitung.
    # Wildcard, damit nginx auch ohne das Setup-Skript startet.
    include /etc/nginx/ili-projterm*.conf;
}
